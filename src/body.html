<header class="brand-bar">
  <div class="wrap brand-row">
    <h1 class="brand">Sổ Vàng</h1>
    <div class="status"><span id="status" aria-live="polite"></span><button id="refresh" class="text-btn" type="button" hidden>Làm mới</button></div>
  </div>
</header>
<div class="controls">
  <div class="wrap market-row">
    <div class="seg" role="group" aria-label="Chọn thị trường">
      <button id="mkt-vn" type="button" data-act="market:vn">Việt Nam</button>
      <button id="mkt-world" type="button" data-act="market:world">Thế giới</button>
    </div>
    <select id="vn-type" class="type-select" aria-label="Chọn loại vàng Việt Nam"></select>
    <span id="world-label" class="market-label" hidden>XAU/USD</span>
  </div>
</div>
<div class="wrap notice-wrap"><div id="notice" class="notice" hidden></div></div>
<main><div class="wrap" id="view"></div></main>
<nav class="nav" aria-label="Các màn hình">
  <div>
    <button id="tab-tong-quan" type="button" data-act="tab:tong-quan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/><path d="M3 21h18"/></svg>Tổng quan</button>
    <button id="tab-ngay" type="button" data-act="tab:ngay"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Theo ngày</button>
    <button id="tab-dot" type="button" data-act="tab:dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 17l5-10 5 8 4-5 6 7"/></svg>Theo đợt</button>
    <button id="tab-du-bao" type="button" data-act="tab:du-bao"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h7"/><path d="M10 12l11-7M10 12l11 7M10 12h11" stroke-dasharray="2.5 2.5"/></svg>Dự báo</button>
  </div>
</nav>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner">
    <div class="sheet-grip" id="sheet-grip" aria-hidden="true"><span></span></div>
    <div class="sheet-head">
      <h2 id="sheet-title" tabindex="-1" autofocus></h2>
      <button id="sheet-close" class="sheet-close" type="button" data-act="sheet:close" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>
