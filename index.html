 */
:root {
  --color-paper: oklch(94.4% 0.009 145.5);
  --color-surface: oklch(98.7% 0.003 128.5);
  --color-surface-2: oklch(96.1% 0.006 137.8);
  --color-ink: oklch(23.3% 0.015 166.2);
  --color-ink-2: oklch(40.3% 0.020 161.9);
  --color-muted: oklch(50.7% 0.020 158.6);
  --color-line: oklch(88.3% 0.013 149.2);
  --color-grid: oklch(92.9% 0.009 145.5);
  --color-sjc: oklch(59.8% 0.121 76.4);
  --color-world: oklch(51.7% 0.105 239.9);
  --color-up: oklch(53.1% 0.103 170.1);
  --color-down: oklch(57.0% 0.172 33.4);
  --color-accent: oklch(47.7% 0.096 78.4);
  --color-accent-ink: oklch(99.4% 0.009 93.6);
  --color-up-soft: oklch(93.3% 0.028 162.1);
  --color-down-soft: oklch(92.3% 0.028 25.9);
  --color-board: oklch(29.9% 0.046 172.3);
  --color-board-ink: oklch(95.3% 0.012 157.0);
  --color-board-muted: oklch(82.6% 0.032 163.1);
  --color-board-gold: oklch(84.6% 0.125 86.6);
  --color-board-up: oklch(84.9% 0.121 161.2);
  --color-board-down: oklch(82.0% 0.101 28.4);
  --color-board-line: oklch(43.0% 0.057 168.4);
  --color-backdrop: oklch(15% 0.01 165 / 0.45);
  --color-shadow: oklch(15% 0.01 165 / 0.18);
  --font-display: "Bitter", Georgia, "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.125rem; --text-xl: 1.375rem; --text-2xl: 1.75rem;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --tap: 44px; --nav-h: 58px;
  --dur-fast: 120ms; --dur-med: 240ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-in: cubic-bezier(0.4, 0, 1, 1); --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --color-paper: oklch(18.4% 0.010 172.9);
  --color-surface: oklch(23.0% 0.014 163.4);
  --color-surface-2: oklch(27.0% 0.016 168.8);
  --color-ink: oklch(95.6% 0.007 151.9);
  --color-ink-2: oklch(84.8% 0.014 159.9);
  --color-muted: oklch(72.9% 0.018 162.6);
  --color-line: oklch(32.8% 0.019 163.5);
  --color-grid: oklch(28.6% 0.017 163.5);
  --color-sjc: oklch(66.5% 0.125 80.4);
  --color-world: oklch(63.4% 0.107 235.7);
  --color-up: oklch(64.9% 0.114 175.9);
  --color-down: oklch(65.4% 0.158 31.9);
  --color-accent: oklch(79.9% 0.122 83.2);
  --color-accent-ink: oklch(20.3% 0.027 87.0);
  --color-up-soft: oklch(31.1% 0.047 163.7);
  --color-down-soft: oklch(28.8% 0.052 26.2);
  --color-board: oklch(32.3% 0.051 171.0);
  --color-board-line: oklch(45.8% 0.063 169.8);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --color-paper: oklch(18.4% 0.010 172.9);
  --color-surface: oklch(23.0% 0.014 163.4);
  --color-surface-2: oklch(27.0% 0.016 168.8);
  --color-ink: oklch(95.6% 0.007 151.9);
  --color-ink-2: oklch(84.8% 0.014 159.9);
  --color-muted: oklch(72.9% 0.018 162.6);
  --color-line: oklch(32.8% 0.019 163.5);
  --color-grid: oklch(28.6% 0.017 163.5);
  --color-sjc: oklch(66.5% 0.125 80.4);
  --color-world: oklch(63.4% 0.107 235.7);
  --color-up: oklch(64.9% 0.114 175.9);
  --color-down: oklch(65.4% 0.158 31.9);
  --color-accent: oklch(79.9% 0.122 83.2);
  --color-accent-ink: oklch(20.3% 0.027 87.0);
  --color-up-soft: oklch(31.1% 0.047 163.7);
  --color-down-soft: oklch(28.8% 0.052 26.2);
  --color-board: oklch(32.3% 0.051 171.0);
  --color-board-line: oklch(45.8% 0.063 169.8);
  color-scheme: dark;
}

/* Một cột kiểu công cụ: bảng giá trên cùng, dữ kiện theo sau, phần chuyên sâu gom vào mục mở rộng. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
html.sheet-open { overflow: hidden; }
body { background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-md)/1.5 var(--font-body); margin: 0; overflow-x: clip; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--color-paper); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }
h1, h2, h3, p, dl, dd { margin: 0; }
h1, h2, h3 { font-style: normal; overflow-wrap: anywhere; min-width: 0; }
a { color: var(--color-accent); }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(var(--space-lg), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-lg), env(safe-area-inset-right, 0px)); }

/* Tên app cuộn đi, chỉ phần chọn thị trường được ghim */
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: var(--tap); padding-block: var(--space-xs); }
.brand { font: 700 var(--text-lg)/1.2 var(--font-display); white-space: nowrap; flex: none; }
.status { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; column-gap: var(--space-md); min-width: 0; font-size: var(--text-xs); line-height: 1.25; color: var(--color-muted); text-align: right; }
.text-btn { border: 0; background: none; min-height: var(--tap); padding: 0 var(--space-xs); color: var(--color-accent); font-weight: 600; font-size: var(--text-sm); white-space: nowrap; }
.text-btn:active { opacity: 0.6; }
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--color-paper); border-bottom: 1px solid var(--color-line); }
.market-row { display: flex; gap: var(--space-sm); padding-block: var(--space-sm); }
.seg { display: flex; flex: 1 1 56%; min-width: 0; background: var(--color-surface-2); border-radius: var(--radius-md); padding: 2px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; background: none; border-radius: var(--radius-sm); font-weight: 500; font-size: var(--text-sm); color: var(--color-ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-ink); font-weight: 600; box-shadow: 0 1px 2px var(--color-shadow); }
.type-select { flex: 1 1 44%; min-width: 0; min-height: var(--tap); border: 1px solid var(--color-line); background: var(--color-surface); border-radius: var(--radius-md); padding: 0 var(--space-sm); font-size: var(--text-md); font-weight: 500; }

.notice-wrap { padding-top: var(--space-md); }
.notice-wrap:has(> .notice[hidden]) { display: none; }
.notice { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: var(--color-surface-2); border: 1px solid var(--color-line); font-size: var(--text-sm); color: var(--color-ink-2); }
.notice.error { background: var(--color-down-soft); }

main { padding-bottom: calc(var(--nav-h) + var(--space-xl) + env(safe-area-inset-bottom, 0px)); }
main .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-md); padding-block: var(--space-md); }

/* Bảng giá */
.board { background: var(--color-board); color: var(--color-board-ink); border-radius: var(--radius-md); padding: var(--space-lg); display: grid; gap: var(--space-md); }
.board-label { font-size: var(--text-sm); color: var(--color-board-muted); }
.price { font: 700 clamp(2.75rem, 14vw, 3.75rem)/1.02 var(--font-display); color: var(--color-board-gold); letter-spacing: -0.02em; }
.price.range { font-size: clamp(1.875rem, 9.5vw, 2.625rem); letter-spacing: -0.01em; }
.price small { font: 500 var(--text-sm)/1 var(--font-body); color: var(--color-board-muted); letter-spacing: 0; margin-left: var(--space-xs); white-space: nowrap; }
.delta { font-weight: 600; }
.delta.up { color: var(--color-board-up); } .delta.down { color: var(--color-board-down); } .delta.flat { color: var(--color-board-muted); }
.board-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-md) var(--space-lg); border-top: 1px solid var(--color-board-line); padding-top: var(--space-md); }
.board-grid dt { font-size: var(--text-xs); color: var(--color-board-muted); }
.board-grid dd { font-weight: 600; font-size: var(--text-md); }
.board-grid dd span { font-weight: 400; font-size: var(--text-xs); color: var(--color-board-muted); }

/* Khối */
.block { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-lg); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }
.block h2, .sheet h2 { font: 700 var(--text-lg)/1.3 var(--font-display); text-wrap: balance; }
.note { font-size: var(--text-sm); color: var(--color-muted); line-height: 1.45; }
.lede { line-height: 1.5; }
.lede b { font-weight: 650; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }

.chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.chip { min-height: var(--tap); padding: 0 var(--space-md); flex: 1 1 auto; border-radius: var(--radius-sm); border: 1px solid var(--color-line); background: none; font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); font-weight: 600; }
.chip:active { opacity: 0.7; }

/* Thước vị trí: giá hiện tại nằm đâu trong khoảng lịch sử */
.meter { display: grid; gap: var(--space-xs); }
.meter + .meter { border-top: 1px solid var(--color-grid); padding-top: var(--space-md); }
.meter-head, .fact { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-xs) var(--space-md); flex-wrap: wrap; }
.meter-head span, .fact > span { color: var(--color-ink-2); font-size: var(--text-sm); }
.meter-head b { font-weight: 650; white-space: nowrap; }
.meter-track { position: relative; height: 6px; margin: var(--space-sm) 7px; background: var(--color-surface-2); border-radius: var(--radius-pill); box-shadow: inset 0 0 0 1px var(--color-line); }
.meter-dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 2px var(--color-surface); }
.meter-mark { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: var(--color-muted); }
.meter-ends { display: flex; justify-content: space-between; gap: var(--space-md); font-size: var(--text-xs); color: var(--color-muted); }
.fact { border-top: 1px solid var(--color-grid); padding-top: var(--space-md); }
.fact .note { flex: 1 0 100%; }

/* Biểu đồ: số đọc nằm cố định phía trên, ngón tay không che */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg text { font: 400 12px var(--font-body); fill: var(--color-muted); }
.readout { min-height: 3.75rem; margin-bottom: var(--space-xs); }
.readout-title { font-size: var(--text-xs); color: var(--color-muted); }
.readout-rows { display: flex; flex-wrap: wrap; gap: 0 var(--space-lg); font-size: var(--text-sm); color: var(--color-ink-2); }
.readout-rows b { font-weight: 650; color: var(--color-ink); margin-left: var(--space-xs); }
.readout-rows i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: var(--space-xs); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: var(--space-xs); }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.legend i.swatch { height: 10px; }

/* Danh sách chỉ số */
.rows { display: grid; }
.rows > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-md); padding: var(--space-sm) 0; border-top: 1px solid var(--color-grid); }
.rows > div:first-child { border-top: 0; }
.rows dt { color: var(--color-ink-2); font-size: var(--text-sm); }
.rows dd { font-weight: 600; text-align: right; }
.rows .sub { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--color-muted); }

.up { color: var(--color-up); } .down { color: var(--color-down); } .flat { color: var(--color-muted); }
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px var(--space-sm); border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; }
.pill.up { background: var(--color-up-soft); } .pill.down { background: var(--color-down-soft); } .pill.flat, .pill.gold { background: var(--color-surface-2); color: var(--color-ink-2); }

/* Mục mở rộng */
details.block { display: block; padding-block: 0; }
details.block > summary { display: flex; align-items: center; gap: var(--space-md); min-height: 52px; font: 700 var(--text-md)/1.3 var(--font-display); cursor: pointer; list-style: none; }
details.block > summary::-webkit-details-marker { display: none; }
details.block > summary .hint { font: 500 var(--text-xs)/1.3 var(--font-body); color: var(--color-muted); margin-left: auto; text-align: right; }
details.block > summary::after { content: ""; flex: none; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--color-muted); border-bottom: 2px solid var(--color-muted); transform: translateY(-2px) rotate(45deg); }
details.block > summary .hint + *, details.block > summary:has(.hint)::after { margin-left: 0; }
details.block[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
details.block > .stack { padding-bottom: var(--space-lg); }

/* Theo ngày */
.day-nav { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); gap: var(--space-sm); }
.day-nav button { min-height: var(--tap); border: 1px solid var(--color-line); background: var(--color-surface); border-radius: var(--radius-md); font-size: var(--text-xl); line-height: 1; }
.day-nav button:active { background: var(--color-surface-2); }
input[type="date"], input[type="number"] { width: 100%; min-width: 0; min-height: var(--tap); border: 1px solid var(--color-line); background: var(--color-surface); border-radius: var(--radius-md); padding: 0 var(--space-md); font-size: var(--text-md); font-weight: 600; -webkit-appearance: none; appearance: none; }
input[type="date"] { text-align: center; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
th { text-align: right; font-weight: 500; font-size: var(--text-xs); color: var(--color-muted); padding: var(--space-xs) 0 var(--space-sm) var(--space-sm); vertical-align: bottom; }
td { text-align: right; padding: var(--space-sm) 0 var(--space-sm) var(--space-sm); border-top: 1px solid var(--color-grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td:first-child { color: var(--color-ink-2); }
tr.hl td { font-weight: 650; color: var(--color-ink); }
.list-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--space-md); align-items: center; width: 100%; min-height: var(--tap); padding: var(--space-xs) 0; border: 0; border-top: 1px solid var(--color-grid); background: none; text-align: left; font-size: var(--text-sm); }
.list-btn:first-child { border-top: 0; }
.list-btn:active, .wave-btn:active { background: var(--color-surface-2); }
.list-btn[aria-current="true"] .ld { color: var(--color-accent); font-weight: 650; }
.list-btn .lv { text-align: right; font-weight: 600; }
.more-btn { justify-self: start; }

/* Theo đợt */
.stat-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-md); }
.stat-pair > div { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-md); display: grid; gap: 2px; align-content: start; }
.stat-pair .k { font-size: var(--text-xs); font-weight: 600; }
.stat-pair .v { font: 700 var(--text-xl)/1.2 var(--font-display); }
.stat-pair .s { font-size: var(--text-xs); color: var(--color-muted); }
.wave-btn { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px var(--space-md); align-items: center; width: 100%; min-height: 56px; padding: var(--space-sm) 0; border: 0; border-top: 1px solid var(--color-grid); background: none; text-align: left; }
.wave-btn:first-child { border-top: 0; }
.wave-btn .wd { font-size: var(--text-sm); font-weight: 600; }
.wave-btn .wm { grid-column: 2 / 4; font-size: var(--text-xs); color: var(--color-muted); }
.wave-btn .wp { font-size: var(--text-sm); font-weight: 650; }
.date-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-sm); }
.date-pair label { display: grid; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); min-width: 0; }

/* Kịch bản */
.scn { display: grid; gap: var(--space-lg); }
.scn-row { display: grid; grid-template-columns: minmax(0, 1fr) 7rem; gap: var(--space-xs) var(--space-md); align-items: center; }
.scn-row label { font-size: var(--text-sm); color: var(--color-ink-2); }
.scn-row input[type="number"] { text-align: right; }
.scn-row input[type="range"] { grid-column: 1 / -1; width: 100%; height: var(--tap); accent-color: var(--color-accent); margin: 0; }
.scn-result { background: var(--color-board); color: var(--color-board-ink); border-radius: var(--radius-md); padding: var(--space-md); display: grid; gap: 2px; }
.scn-result .v { font: 700 var(--text-2xl)/1.15 var(--font-display); color: var(--color-board-gold); }
.scn-result .s { font-size: var(--text-sm); color: var(--color-board-muted); }

.fine { font-size: var(--text-sm); color: var(--color-ink-2); }

/* Tấm trượt chi tiết */
.sheet { width: 100%; max-width: 720px; max-height: 88dvh; margin: auto auto 0; padding: 0; border: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--color-surface); color: var(--color-ink); overflow: hidden; }
.sheet[open] { display: flex; }
.sheet::backdrop { background: var(--color-backdrop, rgb(0 0 0 / 0.45)); }
.sheet-inner { display: flex; flex-direction: column; width: 100%; min-height: 0; }
.sheet-grip { display: grid; place-items: center; height: var(--space-xl); flex: none; touch-action: none; }
.sheet-grip span { width: 36px; height: 4px; border-radius: var(--radius-pill); background: var(--color-line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); padding: 0 var(--space-sm) var(--space-sm) var(--space-lg); flex: none; }
.sheet-close { flex: none; width: var(--tap); height: var(--tap); border: 0; background: none; display: grid; place-items: center; color: var(--color-ink-2); }

    const i = (s.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
    return s[lo] + (s[hi] - s[lo]) * (i - lo);
  }

  // ---------- Dữ liệu ----------

  // Trung vị trượt 5 phiên để khử nhiễu của tỷ giá USD/VND từ Yahoo (có ngày lệch 1-2% rồi quay lại).
  function smoothFx(rows) {
    return rows.map((r, i) => {
      const w = rows.slice(Math.max(0, i - 2), Math.min(rows.length, i + 3)).map((x) => x[1]);
      return [r[0], median(w)];
    });
  }

  // Tạo bộ dữ liệu thống nhất từ snapshot đã nhúng (có thể đã trộn dữ liệu trực tuyến).
  function buildDataset(snap) {
    const world = snap.world.filter((r) => !isWeekend(r[0])).map((r) => ({ d: r[0], p: r[1] }));
    const fx = smoothFx(snap.fx).map((r) => ({ d: r[0], v: r[1] }));
    const vn = {};
    for (const k of Object.keys(snap.vn)) vn[k] = snap.vn[k].map((r) => ({ d: r[0], buy: r[1], sell: r[2], u: r[3] }));
    return { world, fx, vn, sourceDates: { world: world.at(-1).d, vn: vn.SJL1L10.at(-1).d, fx: fx.at(-1).d } };
  }

  // Tra giá trị gần nhất tại hoặc trước một ngày.
  function asOfLookup(rows, field) {
    const dates = rows.map((r) => r.d);
    return (d) => {
      let lo = 0, hi = dates.length - 1, ans = -1;
      while (lo <= hi) { const m = (lo + hi) >> 1; if (dates[m] <= d) { ans = m; lo = m + 1; } else hi = m - 1; }
      return ans < 0 ? null : rows[ans][field];
    };
  }

  // Chuỗi chênh lệch: giá SJC bán so với giá thế giới quy đổi sang VND/lượng.
  function premiumSeries(ds, type = 'SJL1L10') {
    const w = asOfLookup(ds.world, 'p'), f = asOfLookup(ds.fx, 'v');
    return ds.vn[type].map((r) => {
      const wp = w(r.d), fxv = f(r.d);
      const conv = wp * fxv * OZ_PER_LUONG;
      return { d: r.d, sell: r.sell, buy: r.buy, world: wp, fx: fxv, conv, gap: r.sell - conv, pct: (r.sell / conv - 1) * 100, spread: r.sell - r.buy };
    });
  }

  // ---------- Chỉ báo ----------

  function sma(v, n) {
    const out = new Array(v.length).fill(null);
    let s = 0;
    for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= n) s -= v[i - n]; if (i >= n - 1) out[i] = s / n; }
    return out;
  }

  function rsi(v, n = 14) {
    const out = new Array(v.length).fill(null);
    let g = 0, l = 0;
    for (let i = 1; i < v.length; i++) {
      const c = v[i] - v[i - 1], up = Math.max(c, 0), dn = Math.max(-c, 0);
      if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); } }
      else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
    }
    return out;
  }

  // Độ biến động năm hóa từ lợi suất ngày, tính trên n phiên gần nhất.
  function annualVol(v, n = 21, perYear = 252) {
    const r = [];
    for (let i = Math.max(1, v.length - n); i < v.length; i++) r.push(Math.log(v[i] / v[i - 1]));
    return r.length > 1 ? std(r) * Math.sqrt(perYear) * 100 : null;
  }

  function maxDrawdown(v) {
    let peak = v[0], dd = 0;
    for (const x of v) { peak = Math.max(peak, x); dd = Math.min(dd, x / peak - 1); }
    return dd * 100;
  }

  // ---------- Nhận diện đợt tăng/giảm (zigzag) ----------

  // Một đợt kết thúc khi giá đảo chiều từ đỉnh/đáy tạm thời vượt quá ngưỡng thresholdPct.
  function detectWaves(rows, thresholdPct, field = 'p') {
    if (rows.length < 2) return [];
    const th = thresholdPct / 100;
    const pivots = [];
    let dir = 0, hi = 0, lo = 0;
    for (let i = 1; i < rows.length; i++) {
      const p = rows[i][field];
      if (dir === 0) {
        if (p > rows[hi][field]) hi = i;
        if (p < rows[lo][field]) lo = i;
        if (p >= rows[lo][field] * (1 + th)) { dir = 1; pivots.push(lo); hi = i; }
        else if (p <= rows[hi][field] * (1 - th)) { dir = -1; pivots.push(hi); lo = i; }
      } else if (dir === 1) {
        if (p > rows[hi][field]) hi = i;
        else if (p <= rows[hi][field] * (1 - th)) { pivots.push(hi); dir = -1; lo = i; }
      } else {
        if (p < rows[lo][field]) lo = i;
        else if (p >= rows[lo][field] * (1 + th)) { pivots.push(lo); dir = 1; hi = i; }
      }
    }
    if (!pivots.length) return [];
    const last = rows.length - 1;
    const endpoints = dir === 1 ? hi : lo;
    const points = [...pivots, endpoints];
    if (endpoints !== last) points.push(last);

    const waves = [];
    for (let k = 0; k + 1 < points.length; k++) {
      const a = points[k], b = points[k + 1];
      const startP = rows[a][field], endP = rows[b][field];
      const closes = rows.slice(a, b + 1).map((r) => r[field]);
      waves.push({
        i0: a, i1: b, from: rows[a].d, to: rows[b].d,
        startP, endP, pct: (endP / startP - 1) * 100,
        days: daysBetween(rows[a].d, rows[b].d),
        dir: endP >= startP ? 1 : -1,
        high: Math.max(...closes), low: Math.min(...closes),
        vol: annualVol(closes, closes.length),
        // Đoạn cuối chưa xác nhận đảo chiều nên vẫn đang diễn ra.
        ongoing: b === last && (k === points.length - 2),
      });
    }
    return waves;
  }

  function waveSummary(waves) {
    const done = waves.filter((w) => !w.ongoing);
    const pick = (dir) => {
      const g = done.filter((w) => w.dir === dir);
      if (!g.length) return null;
      return { n: g.length, avgPct: mean(g.map((w) => w.pct)), avgDays: mean(g.map((w) => w.days)), medDays: median(g.map((w) => w.days)), best: g.reduce((b, w) => (Math.abs(w.pct) > Math.abs(b.pct) ? w : b)) };
    };
    return { up: pick(1), down: pick(-1) };
  }

  // ---------- Dự báo ----------

  // Ridge giải bằng phương trình chuẩn với khử Gauss.
  function ridgeFit(X, y, lambda) {
    const p = X[0].length;
    const A = Array.from({ length: p }, () => new Array(p + 1).fill(0));
    for (let n = 0; n < X.length; n++) {
      const row = X[n];
      for (let i = 0; i < p; i++) {
        for (let j = i; j < p; j++) A[i][j] += row[i] * row[j];
        A[i][p] += row[i] * y[n];
      }
    }
    for (let i = 0; i < p; i++) { for (let j = 0; j < i; j++) A[i][j] = A[j][i]; A[i][i] += lambda; }
    for (let c = 0; c < p; c++) {
      let m = c;
      for (let r = c + 1; r < p; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
      [A[c], A[m]] = [A[m], A[c]];
      const pv = A[c][c] || 1e-9;
      for (let r = 0; r < p; r++) {
        if (r === c) continue;
        const f = A[r][c] / pv;
        if (f) for (let k = c; k <= p; k++) A[r][k] -= f * A[c][k];
      }
    }
    return A.map((row, i) => row[p] / (row[i] || 1e-9));
  }

  // Đặc trưng kỹ thuật, chỉ dùng dữ liệu đến thời điểm t (không nhìn trước).
  function featureAt(logp, t) {
    const r = (n) => logp[t] - logp[t - n];
    let s = 0;
    for (let i = t - 49; i <= t; i++) s += logp[i];
    let v = 0;
    for (let i = t - 20; i <= t; i++) { const d = logp[i] - logp[i - 1]; v += d * d; }
    const vol = Math.sqrt(v / 21);
    return [1, r(5) / (vol * 2.24), r(21) / (vol * 4.58), r(63) / (vol * 7.94), r(252) / (vol * 15.87), (logp[t] - s / 50) / (vol * 7)];
  }

  const MIN_HIST = 260;

  // Tạo các dự báo log-return h bước tại thời điểm t, chỉ từ dữ liệu <= t.
  function worldModels(logp, t, h, cache) {
    const vol = trailingVol(logp, t, 63);
    const drift = (logp[t] - logp[Math.max(0, t - 756)]) / Math.min(t, 756);

    // Ridge động lượng, huấn luyện lại định kỳ để giảm chi phí.
    let beta = cache && cache.beta;
    if (!beta || !cache || t - cache.t >= 21) {
      const X = [], y = [];
      const start = Math.max(MIN_HIST, t - 1260);
      for (let i = start; i + h <= t; i += Math.max(1, Math.floor(h / 3))) {
        X.push(featureAt(logp, i));
        y.push((logp[i + h] - logp[i]) / (trailingVol(logp, i, 63) * Math.sqrt(h)));
      }
      beta = X.length > 30 ? ridgeFit(X, y, X.length * 0.5) : null;
      if (cache) { cache.beta = beta; cache.t = t; }
    }
    let mom = 0;
    if (beta) {
      const f = featureAt(logp, t);
      mom = f.reduce((s, x, i) => s + x * beta[i], 0) * vol * Math.sqrt(h);
    }
    return {
      naive: 0,
      drift: drift * h * 0.5, // co một nửa để tránh ngoại suy quá mức xu hướng gần đây
      momentum: mom,
    };
  }

  function trailingVol(logp, t, n) {
    let v = 0, c = 0;
    for (let i = Math.max(1, t - n + 1); i <= t; i++) { const d = logp[i] - logp[i - 1]; v += d * d; c++; }
    return Math.sqrt(v / Math.max(1, c)) || 0.008;
  }

  // Kết hợp: trung bình giữa drift đã co và ridge động lượng, rồi co thêm về 0.
  const combine = (m) => 0.5 * (m.drift + m.momentum) * 0.7;

  const WORLD_HORIZONS = [{ key: '1d', cal: 1, h: 1 }, { key: '7d', cal: 7, h: 5 }, { key: '30d', cal: 30, h: 21 }, { key: '90d', cal: 90, h: 63 }];

  // Kiểm định ngược walk-forward: tại mỗi t chỉ biết dữ liệu tới t rồi so với giá thật sau h phiên.
  function backtestWorld(series, opts = {}) {
    const logp = series.map((r) => Math.log(r.p));
    const n = logp.length;
    const lookback = opts.lookback || 1260;
    const out = {};
    for (const hz of WORLD_HORIZONS) {
      const h = hz.h, step = opts.step || (h === 1 ? 5 : Math.max(1, Math.round(h / 2)));
      const cache = {};
      const start = Math.max(MIN_HIST + 260, n - lookback - h);
      const errs = { naive: [], drift: [], momentum: [], blend: [] };
      let dirHit = 0, dirN = 0, naiveDirHit = 0;
      const zs = [];
      let cover80 = 0, cover95 = 0, cn = 0;
      for (let t = start; t + h < n; t += step) {
        const real = logp[t + h] - logp[t];
        const m = worldModels(logp, t, h, cache);
        const blend = combine(m);
        errs.naive.push(Math.abs(real));
        errs.drift.push(Math.abs(real - m.drift));
        errs.momentum.push(Math.abs(real - m.momentum));
        errs.blend.push(Math.abs(real - blend));
        if (real !== 0) {
          dirN++;
          if (Math.sign(blend) === Math.sign(real)) dirHit++;
          if (real > 0) naiveDirHit++;
        }
        const band = bands(logp, t, h, blend);
        cn++;
        if (real >= band.q10 && real <= band.q90) cover80++;
        if (real >= band.q025 && real <= band.q975) cover95++;
        zs.push(real);
      }
      const mae = (a) => mean(a) * 100;
      out[hz.key] = {
        n: errs.naive.length,
        maeNaive: mae(errs.naive), maeDrift: mae(errs.drift), maeMomentum: mae(errs.momentum), maeBlend: mae(errs.blend),
        skill: (1 - mean(errs.blend) / mean(errs.naive)) * 100,
        dirHit: (dirHit / dirN) * 100,
        baseUp: (naiveDirHit / dirN) * 100,
        cover80: (cover80 / cn) * 100, cover95: (cover95 / cn) * 100,
      };
    }
    return out;
  }

  // Khoảng dự báo: phân vị thực nghiệm của lợi suất h phiên đã chuẩn hóa theo biến động lúc đó.
  function bands(logp, t, h, center) {
    const vol = trailingVol(logp, t, 63);
    const zs = [];
    const from = Math.max(70, t - 1260);
    for (let i = from; i + h <= t; i += Math.max(1, Math.floor(h / 2))) {
      zs.push((logp[i + h] - logp[i]) / (trailingVol(logp, i, 63) * Math.sqrt(h)));
    }
    const m = zs.length ? mean(zs) : 0;
    const s = vol * Math.sqrt(h);
    const q = (p) => (zs.length > 20 ? (quantile(zs, p) - m) * s : ({ 0.025: -1.96, 0.1: -1.28, 0.9: 1.28, 0.975: 1.96 }[p]) * s) + center;
    return { q025: q(0.025), q10: q(0.1), q90: q(0.9), q975: q(0.975) };
  }

  // Dự báo thế giới tại điểm cuối chuỗi.
  function forecastWorld(series) {
    const logp = series.map((r) => Math.log(r.p));
    const t = logp.length - 1;
    const last = series[t];
    return WORLD_HORIZONS.map((hz) => {
      const m = worldModels(logp, t, hz.h, {});
      const c = combine(m);
      const b = bands(logp, t, hz.h, c);
      const conv = (x) => last.p * Math.exp(x);
      return { key: hz.key, cal: hz.cal, h: hz.h, date: addDays(last.d, hz.cal), logReturn: c, point: conv(c), lo80: conv(b.q10), hi80: conv(b.q90), lo95: conv(b.q025), hi95: conv(b.q975), models: m };
    });
  }

  const VN_HORIZONS = [1, 7, 30, 90];

  // Giá SJC thường phản ứng trễ một ngày với giá thế giới quy đổi.
  // Hệ số k ước lượng bằng hồi quy chỉ trên dữ liệu đã biết tại thời điểm t.
  function vnLagBeta(prem, t) {
    if (t < 40) return 0.25;
    let sxx = 0, sxy = 0;
    for (let i = 1; i < t; i++) {
      const x = Math.log(prem[i].conv / prem[i - 1].conv);
      sxx += x * x;
      sxy += x * Math.log(prem[i + 1].sell / prem[i].sell);
    }
    return Math.min(0.6, Math.max(0, sxx ? sxy / sxx : 0));
  }

  // Trung tâm dự báo SJC chỉ gồm hiệu ứng trễ một ngày. Kiểm định cho thấy cộng thêm xu hướng thế giới
  // hay giả định chênh lệch hồi về trung bình đều làm sai số lớn hơn so với giả định giá không đổi.
  function vnCenter(prem, t) {
    const k = vnLagBeta(prem, t);
    const lag = t > 0 ? k * Math.log(prem[t].conv / prem[t - 1].conv) : 0;
    return { logReturn: lag, k };
  }

  // Độ lệch chuẩn cho kỳ cal ngày: lấy số lớn hơn giữa thực nghiệm và quy tắc căn bậc hai thời gian.
  function vnSigma(prem, t, cal) {
    const d = [];
    for (let i = 1; i <= t; i++) d.push(Math.log(prem[i].sell / prem[i - 1].sell));
    const root = std(d) * Math.sqrt(cal);
    const r = [];
    for (let i = cal; i <= t; i++) r.push(Math.log(prem[i].sell / prem[i - cal].sell));
    return r.length >= 30 ? Math.max(std(r), root) : root;
  }

  function backtestVN(ds, type = 'SJL1L10') {
    const prem = premiumSeries(ds, type);
    const out = {};
    const start = 60;
    for (const cal of VN_HORIZONS) {
      const eN = [], eM = [];
      let hit = 0, calls = 0, c80 = 0, c95 = 0;
      for (let t = start; t + cal < prem.length; t++) {
        const real = Math.log(prem[t + cal].sell / prem[t].sell);
        const c = vnCenter(prem, t);
        const sd = vnSigma(prem, t, cal);
        eN.push(Math.abs(real));
        eM.push(Math.abs(real - c.logReturn));
        if (real !== 0 && c.logReturn !== 0) { calls++; if (Math.sign(c.logReturn) === Math.sign(real)) hit++; }
        if (Math.abs(real - c.logReturn) <= 1.28 * sd) c80++;
        if (Math.abs(real - c.logReturn) <= 1.96 * sd) c95++;
      }
      const n = eN.length;
      const windows = Math.floor(n / cal);
      // Dưới 6 cửa sổ độc lập thì con số không đủ tin cậy để công bố.
      out[cal + 'd'] = windows < 6 ? { n, windows, tooFew: true } : {
        n, windows,
        maeNaive: mean(eN) * 100, maeModel: mean(eM) * 100,
        skill: (1 - mean(eM) / mean(eN)) * 100,
        dirHit: calls ? (hit / calls) * 100 : null, calls,
        cover80: (c80 / n) * 100, cover95: (c95 / n) * 100,
      };
    }
    return out;
  }

  function forecastVN(ds, type = 'SJL1L10') {
    const prem = premiumSeries(ds, type);
    const t = prem.length - 1;
    const last = prem[t];
    return VN_HORIZONS.map((cal) => {
      const c = vnCenter(prem, t);
      const sd = vnSigma(prem, t, cal);
      const val = (z) => last.sell * Math.exp(c.logReturn + z * sd);
      return { key: cal + 'd', cal, date: addDays(last.d, cal), logReturn: c.logReturn, k: c.k, point: val(0), buy: val(0) - last.spread, lo80: val(-1.28), hi80: val(1.28), lo95: val(-1.96), hi95: val(1.96) };
    });
  }

  return {
    OZ_PER_LUONG, toTime, toDate, isWeekend, addDays, daysBetween, mean, std, median, quantile,
    buildDataset, asOfLookup, premiumSeries, sma, rsi, annualVol, maxDrawdown,
    detectWaves, waveSummary, backtestWorld, backtestVN, forecastWorld, forecastVN,
    WORLD_HORIZONS, VN_HORIZONS,
  };
});

<script>(function () {
